name: Checktime bisect (paired)

on:
  push:
    branches: ['bisect/**']

permissions:
  contents: read

env:
  CADMPEG_JOBS: 3
  CARGO_BUILD_JOBS: 3
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: never
  SOURCE_URL: https://raw.githubusercontent.com/VoronDesign/Voron-1/538f354c7b1dcb14607b40784650e141bd49edae/CAD/Voron%20V1.8%20Master%20Model%20v148.f3z
  SOURCE_SHA256: 50ebd4de6f544c3e1d35bc056f795e82650ae46a0f6b7dbdfbe05a70499db2f2

jobs:
  pair:
    if: github.repository == 'raykholo/cadmpeg'
    name: pair ${{ matrix.pair[1] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        pair: [["2c7cfac92d40b1a9ad93b0cff80fbfc7f5cba770","ea40100fab17df9a4d8f0c452afdb2b34045c43c"],["ea40100fab17df9a4d8f0c452afdb2b34045c43c","4b4c6bb4a5cb77523bea435c17ebcc228f9ec050"],["4b4c6bb4a5cb77523bea435c17ebcc228f9ec050","d62b6786000a0d7097606c2cefde82a2a10aed50"],["d62b6786000a0d7097606c2cefde82a2a10aed50","1f7dd5736bbd5ce1db6c6e0662561825141d6755"],["0c5dace116320e21528bf8b0e4548174eec1e24f","7a40aea67ff27ca4509079a505c93eff3cf98a7f"],["7a40aea67ff27ca4509079a505c93eff3cf98a7f","156573f5e1386ceda6ea1b272018ec3ab8952712"],["156573f5e1386ceda6ea1b272018ec3ab8952712","397e9f49cef3f4f1a973387203ed8267f2601b70"],["397e9f49cef3f4f1a973387203ed8267f2601b70","d31fb41568cb94a98754adf43ef0de92dfb8ddf2"],["d31fb41568cb94a98754adf43ef0de92dfb8ddf2","00368f95f0db9301e65536dab6c34cab8325ee10"],["00368f95f0db9301e65536dab6c34cab8325ee10","cdb9e671845b73b4b1a147cb93036eaf636b434f"]]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pinned-rust
      - name: Fetch input
        run: |
          set -euo pipefail
          lscpu | grep -E 'Model name|^CPU\(s\)'
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/in.f3z" "$SOURCE_URL"
          printf '%s  %s\n' "$SOURCE_SHA256" "$RUNNER_TEMP/in.f3z" | sha256sum --check
      - name: Build both commits
        env:
          BASE: ${{ matrix.pair[0] }}
          CAND: ${{ matrix.pair[1] }}
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/target"
          for c in "$BASE" "$CAND"; do
            git checkout -q --force "$c"
            cargo build -q --locked --release -p cadmpeg --no-default-features --features f3d
            cp "$CARGO_TARGET_DIR/release/cadmpeg" "$RUNNER_TEMP/cadmpeg-$c"
          done
      - name: Time A B A B on this runner
        env:
          BASE: ${{ matrix.pair[0] }}
          CAND: ${{ matrix.pair[1] }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess, time
          t = os.environ["RUNNER_TEMP"]; base = os.environ["BASE"]; cand = os.environ["CAND"]
          times = {base: [], cand: []}
          for c in (base, cand, base, cand):
              s = time.monotonic()
              r = subprocess.run(["timeout", "1500", f"{t}/cadmpeg-{c}", "check", f"{t}/in.f3z"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              times[c].append(round(time.monotonic() - s, 1))
              print("run", c[:10], times[c][-1], "exit", r.returncode, flush=True)
          b = sum(times[base]) / 2; k = sum(times[cand]) / 2
          print("PAIR RESULT " + json.dumps(dict(base=base, cand=cand, base_s=times[base], cand_s=times[cand], ratio=round(k / b, 3))), flush=True)
          PYTHON
