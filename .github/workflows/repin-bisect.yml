name: repin-bisect
# Fork-only: decode four public files at each listed cadmpeg commit and upload compact extracts.
on:
  push:
    branches: ['bisect/repin*']
jobs:
  point:
    if: github.repository == 'raykholo/cadmpeg'
    name: point ${{ matrix.sha }}
    runs-on: ${{ vars.FLYER == 'on' && 'flyer' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        sha: ["0bf564adb689ade3cd800c2112057366a7fd7c96","a90647c7e4e0fd24b3df28edef0c782f1033e435","696d47498a43936ac7c24a15ef2aadb34d2021e8","0804ea5befca3599eaa6c5f8de1ef5a45977ab29","f632a5ad9c783290064c52e84326c49a9cc118b2","e7c7298f6d441548ccc05ce491e70d8011db0738","c78baf78ab53fb9f47dfa636d10d2969a8438816","397c110591cce521d890b4ae944b0c3bd121c9f6","945a5f58d04e2fe619fc2bafae587e758832da60","663fa082ca142ad6adf5b654efc6afe6282d8cfb"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: src
      - name: Toolchain
        run: rustup toolchain install 1.97.0 --profile minimal && rustup default 1.97.0
      - name: Build
        working-directory: src
        run: cargo build --release --locked -p cadmpeg --no-default-features --features f3d
      - name: Files
        run: |
          mkdir -p files
          python3 - <<'PY'
          import json, hashlib, urllib.request
          for f in json.load(open("harness/.github/bisect/files.json")):
              import time
              for attempt in range(6):
                  try:
                      b = urllib.request.urlopen(f["url"], timeout=120).read()
                  except Exception as e:
                      print("retry", f["name"], e); time.sleep(30 * (attempt + 1)); continue
                  if hashlib.sha256(b).hexdigest() == f["sha256"]: break
                  print("hash mismatch", f["name"], len(b)); time.sleep(30 * (attempt + 1))
              else:
                  raise SystemExit("download failed: " + f["name"])
              open("files/" + f["name"], "wb").write(b)
          PY
      - name: Decode
        run: |
          S=${{ matrix.sha }}; mkdir -p out
          for f in files/*; do n=$(basename "$f")
            timeout 1800 src/target/release/cadmpeg dump "$f" -o d.json > "out/$n.dump.txt" 2>&1; echo "rc=$?" >> "out/$n.dump.txt"
            [ -s d.json ] && python3 harness/.github/bisect/extract.py d.json "$n" "out/$n.json"; rm -f d.json
            timeout 1800 src/target/release/cadmpeg check "$f" > "out/$n.check.txt" 2>&1; echo "rc=$?" >> "out/$n.check.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: point-${{ matrix.sha }}
          path: out
          retention-days: 7
